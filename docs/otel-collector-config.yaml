# Sample OpenTelemetry Collector config for local docker-compose.
# Receives OTLP HTTP/gRPC; exports traces to the debug (logging) exporter.
# Production: replace `debug` with Tempo / Jaeger / Honeycomb / etc.
#
# Companion env for the API: docs/otel-collector.env.sample

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
